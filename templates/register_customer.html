{% extends "base.html" %}

{% block title %}Register Customer - Saviora RMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-panel p-5">
            <h3 class="fw-bold mb-4 text-center"><i class="bi bi-person-plus-fill text-primary me-2"></i>New Customer</h3>
            
            <form method="POST">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                    <label for="name">Full Name</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="03XXXXXXXXX" required>
                    <label for="phone">Phone Number (Loyalty ID)</label>
                </div>
                
                <div class="bg-dark p-3 rounded mb-4 border border-secondary">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-primary rounded-circle p-2"><i class="bi bi-star-fill text-white"></i></div>
                        <div>
                            <div class="fw-bold">Starter Tier</div>
                            <div class="small text-muted">Customer will start at 0 points and earn rewards on every visit.</div>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex gap-3">
                    <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-light w-50 py-3">Cancel</a>
                    <button type="submit" class="btn btn-primary w-50 py-3 fw-bold">Register Guest</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
